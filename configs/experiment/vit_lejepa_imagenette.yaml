# @package _global_
# Baseline : ViT-S/8, LeJEPA, Imagenette 128px, 800 epochs, bf16. Reference de toutes les
# autres experiences.
#
# Prerequis : lo data prepare imagenette
#   lo pretrain experiment=vit_lejepa_imagenette cluster=dce -m
#
# bf16 : gpu_prod_long ne sert que des noeuds sh (RTX 3080, bf16 materiel), voir docs/CLUSTER.md.
# Duree mesuree sur sh00 (grad_checkpointing, sans compile) : ~1 min par epoch, soit ~13-14 h pour
# les 800 epochs.
defaults:
  - override /backbone: vit_s8
  - override /data: imagenette

experiment_name: vit_lejepa_imagenette

method:
  precision: bf16
