# Pool de pré-entraînement de la small league : train officiel d'Imagenette, sans labels
# (les labels ne servent qu'à la sonde en ligne, sur embeddings détachés).
# Prérequis : python tools/prepare_data.py imagenette
source:
  _target_: latentopt.data.datasets.imagenette.pretraining_images
img_size: 128
num_probe_classes: 10
probe_task: imagenette_cls # val de la sonde en ligne (holdout 5 % du train, transform d'éval)
