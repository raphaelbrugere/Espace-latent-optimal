# Pool de pré-entraînement : split train figé de Galaxy10 DECaLS (80 %, 14 185 images), labels
# pour la sonde en ligne seulement. Hors protocole (pool du protocole : imagenette) : scores
# non comparables à ceux de la baseline. Val et test n'y entrent pas.
# Prérequis : lo data prepare galaxy10
source:
  _target_: latentopt.data.datasets.galaxy10.pretraining_images
img_size: 128
num_probe_classes: 10
probe_task: galaxy10_cls # val de la sonde en ligne : split val figé, hors du pool
