# @package _global_
# Reglages Hydra communs aux points d'entree (pretrain, train, eval), en tete de leurs defaults.
# Chacun ne definit ensuite que ses dossiers (hydra.run.dir, hydra.sweep).
hydra:
  job:
    chdir: false # le code tourne depuis le dossier de lancement
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/run.log
