# @package _global_
# Réglages Hydra communs aux points d'entrée (pretrain, train, eval), en tête de leurs defaults.
# Chacun ne définit ensuite que ses dossiers (hydra.run.dir, hydra.sweep).
hydra:
  job:
    chdir: false # le code tourne depuis le dossier de lancement
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/run.log
