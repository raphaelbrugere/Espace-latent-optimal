# @package _global_
# Base des configs cluster (defaults de local, ci, dce) : pas un cluster à choisir seul.
# DATA_ROOT / OUTPUT_ROOT déplacent données et résultats (ex. disque partagé du DCE).
cluster:
  name: ??? # chaque cluster le définit
  data_root: ${oc.env:DATA_ROOT,${project_root:}/data}
  results_root: ${oc.env:OUTPUT_ROOT,${project_root:}/results}
  mlflow: true # base MLflow par run (<run>/mlflow.db) ; false : désactivé
