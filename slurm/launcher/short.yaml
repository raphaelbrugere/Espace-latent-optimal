# @package _global_
# Job court sur le DCE (gpu_inter, 2 h max, 1 job a la fois) : smoke runs. Voir README.md.
#
#   lo pretrain experiment=smoke launcher=short -m
#   lo pretrain experiment=smoke launcher=short hydra.launcher.timeout_min=120 -m
#
# gpu_inter sert aussi des RTX 2080 Ti (pas de bf16) : fp16 ou fp32 seulement.
defaults:
  - override /env: dce # un job Slurm tourne forcement sur le DCE
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    account: 3a_cs_ia_n40_safran
    partition: gpu_inter
    timeout_min: 30
    nodes: 1
    tasks_per_node: 1
    gpus_per_node: null # pas de gres sur le DCE (voir long.yaml)
    cpus_per_task: 8
    mem_gb: 24
    exclude: sh[10-16] # GTX 1080 Ti : sans doute plus prises en charge par torch
    array_parallelism: 1 # gpu_inter : 1 job par utilisateur
