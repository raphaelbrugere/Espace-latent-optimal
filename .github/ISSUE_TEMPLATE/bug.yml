name: Bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pour reproduire
      description: >-
        Commande exacte et environnement (local, DCE, CI), ou lien du job CI. Pour un run :
        son dossier et le contenu de son git.txt (commit, fichiers non commités).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Traceback, ou extrait du run.log du dossier de run.
      render: text
