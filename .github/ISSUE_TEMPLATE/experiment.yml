name: Expérience
description: Carte d'expérience, obligatoire avant tout gros run
labels: ["experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothèse
      description: >-
        Ce qu'on cherche à vérifier et le résultat attendu. Citer la config `experiment=`
        si elle existe déjà.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Références
      description: Runs auxquels on se compare, un nom par ligne (docs/HUB.md).
      render: text
  - type: input
    id: budget
    attributes:
      label: Budget de calcul estimé
      placeholder: nombre de jobs × heures GPU par job
  - type: textarea
    id: runs
    attributes:
      label: Runs
      description: >-
        À compléter à chaque lancement : un nom complet par ligne (`<run>`,
        `<run>/downstream/<…>`, `…/eval/<…>`), utilisable tel quel dans les commandes `lo`.
      render: text
  - type: textarea
    id: results
    attributes:
      label: Résultats
      description: Scores clés par run (results.json), face aux références.
  - type: textarea
    id: conclusion
    attributes:
      label: Conclusion
      description: Hypothèse validée ou non, suite à donner.
  - type: checkboxes
    id: published
    attributes:
      label: Avant de fermer
      options:
        - label: Runs publiés (`lo hub push <run>`)
