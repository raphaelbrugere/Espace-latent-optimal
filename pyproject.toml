[project]
name = "latentopt"
version = "0.1.0"
description = "Backbone de vision pré-entraîné en auto-supervisé (LeJEPA) et têtes supervisées, pour l'embarqué"
readme = "README.md"
authors = [
    { name = "Flavien Liardet", email = "flavien.liardet@student-cs.fr" },
    { name = "Ethan Bitton", email = "ethan.bitton@student-cs.fr" },
    { name = "Raphaël Brugère", email = "raphael.brugere@student-cs.fr" },
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "hydra-core>=1.3.8",
    "hydra-submitit-launcher>=1.2.0",
    "lightning>=2.6.6",
    "scipy>=1.18.1",
    "timm>=1.0.31",
    "torch>=2.15",
    "torchvision>=0.29",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
