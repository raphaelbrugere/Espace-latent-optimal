[project]
name = "latentopt"
version = "0.1.0"
description = "Backbone de vision pré-entraîné en auto-supervisé (LeJEPA) et têtes supervisées, pour l'embarqué"
readme = "README.md"
authors = [
    { name = "Flavien Liardet", email = "flavien.liardet@student-cs.fr" },
    { name = "Ethan Bitton", email = "ethan.bitton@student-cs.fr" },
    { name = "Raphaël Brugère", email = "raphael.brugere@student-cs.fr" },
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Arène LeJEPA : code des organisateurs, copié tel quel dans chaque soumission.
extend-exclude = ["projects/lejepa_arena"]
# Indispensable avec pre-commit, qui passe les fichiers un par un à ruff.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
